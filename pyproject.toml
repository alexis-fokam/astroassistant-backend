[project]
name = "astrovitals-backend"
version = "0.1.0"
description = "AstroVitals — moteur Mentor IA (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.11.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2",
    "ruff>=0.8",
]
# Exploratory analysis (notebooks/): pip install -e ".[notebooks]"
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.protocols" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through default values.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks: long f-strings in printed reports are fine.
"notebooks/*" = ["E501", "B905"]
